<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#7C3AED">
    <title>Iniciar sesión - TONYLEX</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='icons/icon-96.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
    <style>
        body {
            background:
                radial-gradient(1200px 600px at 10% -10%, rgba(124, 58, 237, 0.35), transparent 55%),
                radial-gradient(900px 500px at 100% 0%, rgba(167, 139, 250, 0.22), transparent 50%),
                linear-gradient(160deg, #0b0a12 0%, #16122a 45%, #0f172a 100%);
        }
        .login-card {
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(124, 58, 237, 0.12);
            box-shadow: 0 25px 60px -20px rgba(76, 29, 149, 0.55);
            animation: rise 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(16px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .brand-mark {
            filter: drop-shadow(0 12px 24px rgba(0,0,0,0.35));
            animation: pop 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        @keyframes pop {
            from { opacity: 0; transform: scale(0.88); }
            to { opacity: 1; transform: scale(1); }
        }
        .tx-btn {
            background: linear-gradient(135deg, #7C3AED, #6D28D9);
            box-shadow: 0 10px 24px -8px rgba(124, 58, 237, 0.65);
            transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
        }
        .tx-btn:hover {
            filter: brightness(1.05);
            transform: translateY(-1px);
            box-shadow: 0 14px 28px -8px rgba(124, 58, 237, 0.75);
        }
        .tx-input:focus {
            border-color: #8B5CF6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <img src="{{ url_for('static', filename='brand/logo-tonylex.png') }}"
                 alt="TONYLEX" class="brand-mark w-24 h-auto mx-auto mb-4">
            <img src="{{ url_for('static', filename='brand/tonylex-wordmark.png') }}"
                 alt="TONYLEX" class="h-8 mx-auto mb-2 opacity-95">
            <p class="text-sm text-violet-200/80 mt-2">Inicia sesión para continuar</p>
        </div>

        <div class="login-card rounded-3xl p-6 sm:p-7">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                <div class="mb-4 px-4 py-3 rounded-2xl text-sm border {{ 'bg-red-50 border-red-200 text-red-700' if category in ('danger', 'error') else 'bg-emerald-50 border-emerald-200 text-emerald-700' }}" role="alert">
                    {{ message }}
                </div>
                {% endfor %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-4">
                {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
                <div>
                    <label for="username" class="block text-sm font-semibold text-slate-700 mb-1.5">Usuario</label>
                    <input id="username" name="username" type="text" required autofocus
                           autocomplete="username" autocapitalize="none" spellcheck="false"
                           value="{{ username or '' }}"
                           class="tx-input w-full px-4 py-3 border border-slate-200 rounded-2xl focus:outline-none bg-slate-50/80">
                </div>
                <div>
                    <label for="password" class="block text-sm font-semibold text-slate-700 mb-1.5">Contraseña</label>
                    <input id="password" name="password" type="password" required
                           autocomplete="current-password"
                           class="tx-input w-full px-4 py-3 border border-slate-200 rounded-2xl focus:outline-none bg-slate-50/80">
                </div>
                <button type="submit"
                        class="tx-btn w-full py-3.5 rounded-2xl text-white font-semibold">
                    Entrar
                </button>
            </form>
        </div>
    </div>
</body>
</html>
