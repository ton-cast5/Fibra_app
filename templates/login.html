<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#7C3AED">
    <title>Iniciar sesión - TONYLEX</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tonylex-shell.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='icons/icon-96.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
    <style>
        body.login-shell {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background:
                radial-gradient(900px 420px at 0% 0%, rgba(124,58,237,.14), transparent 55%),
                radial-gradient(700px 380px at 100% 10%, rgba(167,139,250,.12), transparent 50%),
                linear-gradient(180deg, #F7F6FB, #EEEDF5);
        }
        .login-wrap { width: min(100%, 420px); }
        .login-card {
            background: #fff;
            border: 1px solid rgba(26,22,48,.08);
            border-radius: 1.75rem;
            box-shadow: 0 28px 60px -28px rgba(76,29,149,.4);
            padding: 1.75rem;
            animation: rise .55s cubic-bezier(.22,1,.36,1) both;
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(16px) scale(.98); }
            to { opacity: 1; transform: none; }
        }
        .login-card input {
            width: 100%;
            border: 1px solid rgba(26,22,48,.12);
            background: #F7F6FB;
            border-radius: 1rem;
            padding: .9rem 1rem;
            outline: none;
        }
        .login-card input:focus {
            border-color: #8B5CF6;
            box-shadow: 0 0 0 3px rgba(139,92,246,.22);
            background: #fff;
        }
        .login-btn {
            width: 100%;
            border: 0;
            border-radius: 999px;
            padding: .95rem 1rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #7C3AED, #6D28D9);
            box-shadow: 0 14px 28px -12px rgba(124,58,237,.85);
            cursor: pointer;
        }
        .login-btn:hover { filter: brightness(1.05); }
        .brand-logo {
            width: 5.5rem;
            height: auto;
            margin: 0 auto 0.75rem;
            display: block;
        }
    </style>
</head>
<body class="login-shell">
    <div class="login-wrap">
        <div class="text-center mb-6">
            <img class="brand-logo" src="{{ url_for('static', filename='brand/logo-tonylex.png') }}" alt="TONYLEX">
            <img src="{{ url_for('static', filename='brand/tonylex-wordmark.png') }}" alt="TONYLEX" style="height:1.75rem;margin:0 auto;display:block;filter:brightness(0.15);">
            <p style="margin-top:.75rem;color:#6B6685;font-size:.9rem;">Gestiona tu red con estilo</p>
        </div>

        <div class="login-card">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                <div class="mb-4 px-4 py-3 rounded-2xl text-sm border {{ 'bg-red-50 border-red-200 text-red-700' if category in ('danger', 'error') else 'bg-emerald-50 border-emerald-200 text-emerald-700' }}" role="alert">
                    {{ message }}
                </div>
                {% endfor %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-4">
                {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
                <div>
                    <label for="username" class="block text-sm font-semibold text-slate-700 mb-1.5">Usuario</label>
                    <input id="username" name="username" type="text" required autofocus
                           autocomplete="username" autocapitalize="none" spellcheck="false"
                           value="{{ username or '' }}">
                </div>
                <div>
                    <label for="password" class="block text-sm font-semibold text-slate-700 mb-1.5">Contraseña</label>
                    <input id="password" name="password" type="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="login-btn">Entrar</button>
            </form>
        </div>
    </div>
</body>
</html>
