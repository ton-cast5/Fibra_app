<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#6C5CEF">
    <title>Iniciar sesión - TONYLEX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tonylex-shell.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='icons/icon-96.png') }}">
    <style>
        body {
            font-family: Manrope, sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background:
                radial-gradient(900px 420px at 8% -5%, rgba(108,92,239,.12), transparent 55%),
                linear-gradient(180deg, #F4F2F8, #ECEAF3);
        }
        .card {
            width: min(100%, 420px);
            background: #fff;
            border: 1px solid rgba(20,19,28,.08);
            border-radius: 28px;
            box-shadow: 0 28px 60px -28px rgba(40,30,80,.35);
            padding: 1.75rem;
        }
        .card input {
            width: 100%;
            border: 1px solid rgba(20,19,28,.12);
            background: #F7F6FB;
            border-radius: 14px;
            padding: .9rem 1rem;
            font: inherit;
        }
        .card input:focus {
            outline: none;
            border-color: #6C5CEF;
            box-shadow: 0 0 0 3px rgba(108,92,239,.2);
            background: #fff;
        }
        .btn {
            width: 100%;
            border: 0;
            border-radius: 999px;
            padding: .95rem 1rem;
            font: inherit;
            font-weight: 800;
            color: #fff;
            background: #6C5CEF;
            box-shadow: 0 14px 28px -12px rgba(108,92,239,.85);
            cursor: pointer;
        }
        label { display:block; font-size:.88rem; font-weight:700; margin:0 0 .4rem; color:#14131C; }
        .field { margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div style="width:min(100%,420px);">
        <div style="text-align:center;margin-bottom:1.25rem;">
            <img src="{{ url_for('static', filename='brand/logo-tonylex.png') }}" alt="TONYLEX" style="width:72px;height:auto;margin:0 auto .75rem;display:block;">
            <div style="font-weight:800;font-size:1.35rem;letter-spacing:.04em;">TONYLEX</div>
            <div style="color:#7A7690;font-size:.9rem;margin-top:.25rem;">Red óptica, mejor operación</div>
        </div>
        <div class="card">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                <div style="margin-bottom:1rem;padding:.75rem 1rem;border-radius:16px;font-size:.88rem;border:1px solid {{ '#fecaca' if category in ('danger','error') else '#bbf7d0' }};background:{{ '#fef2f2' if category in ('danger','error') else '#f0fdf4' }};color:{{ '#b91c1c' if category in ('danger','error') else '#15803d' }};">
                    {{ message }}
                </div>
                {% endfor %}
            {% endwith %}
            <form method="POST" action="{{ url_for('auth.login') }}">
                {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
                <div class="field">
                    <label for="username">Usuario</label>
                    <input id="username" name="username" type="text" required autofocus autocomplete="username" autocapitalize="none" spellcheck="false" value="{{ username or '' }}">
                </div>
                <div class="field">
                    <label for="password">Contraseña</label>
                    <input id="password" name="password" type="password" required autocomplete="current-password">
                </div>
                <button class="btn" type="submit">Entrar</button>
            </form>
        </div>
    </div>
</body>
</html>
