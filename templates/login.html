<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#4f46e5">
    <title>Iniciar sesión - Fibra Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='icons/icon-96.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
</head>
<body class="min-h-screen bg-gradient-to-br from-gray-900 via-gray-800 to-indigo-900 flex items-center justify-center px-4">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <img src="{{ url_for('static', filename='icons/icon-192.png') }}" alt="" class="w-20 h-20 mx-auto rounded-2xl shadow-lg mb-4">
            <h1 class="text-2xl font-extrabold text-white">Fibra Manager</h1>
            <p class="text-sm text-gray-300 mt-1">Inicia sesión para continuar</p>
        </div>

        <div class="bg-white rounded-2xl shadow-2xl p-6">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                <div class="mb-4 px-4 py-3 rounded-lg text-sm border {{ 'bg-red-50 border-red-300 text-red-700' if category in ('danger', 'error') else 'bg-green-50 border-green-300 text-green-700' }}" role="alert">
                    {{ message }}
                </div>
                {% endfor %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-4">
                {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
                <div>
                    <label for="username" class="block text-sm font-semibold text-gray-700 mb-1">Usuario</label>
                    <input id="username" name="username" type="text" required autofocus
                           autocomplete="username" autocapitalize="none" spellcheck="false"
                           value="{{ username or '' }}"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label for="password" class="block text-sm font-semibold text-gray-700 mb-1">Contraseña</label>
                    <input id="password" name="password" type="password" required
                           autocomplete="current-password"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <button type="submit"
                        class="w-full py-3 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-semibold shadow-md transition-colors">
                    Entrar
                </button>
            </form>
        </div>
    </div>
</body>
</html>
